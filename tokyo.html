<title>Tokyo Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700;6..72,800&display=swap">
<style>
  :root {
    --orange:   #EC632F;
    --gold:     #EF9F20;
    --charcoal: #333330;
    --taupe-dk: #9E9895;

    --ground:   #F7F4F2;
    --card-ink: #FFFFFF;
    --inset:    rgba(51, 51, 48, .22);
    --shadow:   0 1px 2px rgba(51,51,48,.06), 0 8px 24px -12px rgba(236,99,47,.28);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #262624;
      --inset:  rgba(28, 28, 26, .30);
      --shadow: 0 1px 2px rgba(0,0,0,.24), 0 10px 28px -14px rgba(236,99,47,.42);
    }
  }

  :root[data-theme="dark"] {
    --ground: #262624;
    --inset:  rgba(28, 28, 26, .30);
    --shadow: 0 1px 2px rgba(0,0,0,.24), 0 10px 28px -14px rgba(236,99,47,.42);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px;
    background: var(--ground);
    font-family: "Newsreader", "Lyon Text", Georgia, "Times New Roman", serif;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
  }

  .clock {
    background: linear-gradient(148deg, var(--orange) 0%, var(--gold) 100%);
    border-radius: 14px;
    padding: 15px 16px 13px;
    color: var(--card-ink);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 11px;
    max-width: 320px;
  }

  .city {
    font-size: 1.02rem;
    font-weight: 800;
    letter-spacing: .1em;
    line-height: 1.1;
  }

  .readout {
    background: var(--inset);
    border-radius: 9px;
    padding: 13px 10px 11px;
    text-align: center;
  }

  .readout .time {
    display: block;
    font-size: 1.78rem;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  .readout .time .mer {
    font-size: .5em;
    font-weight: 700;
    letter-spacing: .14em;
    margin-left: .34em;
    color: rgba(255, 255, 255, .88);
  }

  .readout .date {
    display: block;
    margin-top: 8px;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .12em;
    color: rgba(255, 255, 255, .88);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .12em;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--card-ink);
    flex: none;
  }

  .status.is-closed { color: rgba(255, 255, 255, .72); }
  .status.is-closed .dot { background: rgba(255, 255, 255, .5); }

  .status .lag {
    margin-left: auto;
    font-weight: 600;
    letter-spacing: .08em;
    color: rgba(255, 255, 255, .78);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="clock">
  <div class="city">Tokyo</div>
  <div class="readout">
    <span class="time" id="time">&mdash;&mdash;</span>
    <span class="date" id="date"></span>
  </div>
  <div class="status" id="status">
    <span class="dot"></span><span class="label"></span><span class="lag"></span>
  </div>
</div>

<script>
  var ZONE = "Asia/Tokyo";
  var HOME = "America/New_York"; // local reference for the offset

  function partsFor(date, zone) {
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: zone, hour12: false, year: "numeric", month: "short",
      day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit",
      second: "2-digit"
    });
    var out = {};
    fmt.formatToParts(date).forEach(function (part) { out[part.type] = part.value; });
    return out;
  }

  // True UTC offset in minutes, re-derived each tick so DST needs no table.
  function zoneOffsetMinutes(date, zone) {
    var q = partsFor(date, zone);
    var months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5,
                   Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
    var asUTC = Date.UTC(
      parseInt(q.year, 10), months[q.month], parseInt(q.day, 10),
      parseInt(q.hour, 10) % 24, parseInt(q.minute, 10), parseInt(q.second, 10)
    );
    return Math.round((asUTC - date.getTime()) / 60000);
  }

  function tick() {
    var now = new Date();
    var q = partsFor(now, ZONE);
    var h24 = parseInt(q.hour, 10);
    var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    var mer = h24 < 12 ? "am" : "pm";

    document.getElementById("time").innerHTML =
      h12 + ":" + q.minute + '<span class="mer">' + mer + '</span>';
    document.getElementById("date").textContent =
      q.weekday + ", " + q.month + " " + q.day;

    var weekend = q.weekday === "Sat" || q.weekday === "Sun";
    var open = !weekend && h24 >= 9 && h24 < 18;
    var status = document.getElementById("status");
    status.className = "status" + (open ? "" : " is-closed");
    status.querySelector(".label").textContent =
      open ? "In office" : (weekend ? "Weekend" : "After hours");

    var diff = Math.round(
      (zoneOffsetMinutes(now, ZONE) - zoneOffsetMinutes(now, HOME)) / 60
    );
    status.querySelector(".lag").textContent =
      diff === 0 ? "Your time" : (diff > 0 ? "+" : "") + diff + "h";
  }

  tick();
  setInterval(tick, 10000);
</script>
