<title>Atlanta Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<style>
  :root {
    --orange:   #EC632F;
    --gold:     #EF9F20;
    --charcoal: #333330;
    --taupe-lt: #D9CFC8;
    --taupe-dk: #9E9895;

    --ground:   #F7F4F2;
    --shadow:   0 1px 3px rgba(51, 51, 48, .16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #262624;
      --shadow: 0 1px 3px rgba(0, 0, 0, .34);
    }
  }

  :root[data-theme="dark"] {
    --ground: #262624;
    --shadow: 0 1px 3px rgba(0, 0, 0, .34);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px;
    background: var(--ground);
    font-family: "Newsreader", "Lyon Text", Georgia, "Times New Roman", serif;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
  }

  .clock {
    background: var(--charcoal);
    border-radius: 12px;
    padding: 22px 20px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 320px;
  }

  .city {
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .17em;
    line-height: 1.15;
    color: var(--taupe-lt);
  }

  .readout { text-align: center; }

  .time {
    display: block;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
  }

  .time .mer {
    font-size: .5em;
    font-weight: 600;
    letter-spacing: .14em;
    margin-left: .34em;
    color: var(--taupe-dk);
  }

  /* the gradient runs through the numerals; the flat gold above is the fallback */
  @supports (-webkit-background-clip: text) {
    .time {
      background: linear-gradient(100deg, var(--orange) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .time .mer { -webkit-text-fill-color: var(--taupe-dk); }
  }

  .date {
    display: block;
    margin-top: 8px;
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--taupe-dk);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .13em;
    color: var(--taupe-lt);
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    flex: none;
  }

  .status.is-closed .dot { background: var(--taupe-dk); }

  .status .lag {
    margin-left: auto;
    font-weight: 500;
    color: var(--taupe-dk);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="clock">
  <div class="city">Atlanta</div>
  <div class="readout">
    <span class="time" id="time">&mdash;&mdash;</span>
    <span class="date" id="date"></span>
  </div>
  <div class="status" id="status">
    <span class="dot"></span><span class="label"></span><span class="lag"></span>
  </div>
</div>

<script>
  var ZONE = "America/New_York";
  var HOME = "America/New_York"; // local reference for the offset
  var MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5,
                 Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

  function partsFor(date, zone) {
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: zone, hour12: false, year: "numeric", month: "short",
      day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit",
      second: "2-digit"
    });
    var out = {};
    fmt.formatToParts(date).forEach(function (part) { out[part.type] = part.value; });
    return out;
  }

  // True UTC offset in minutes, re-derived each tick so DST needs no table.
  function zoneOffsetMinutes(date, zone) {
    var q = partsFor(date, zone);
    var asUTC = Date.UTC(
      parseInt(q.year, 10), MONTHS[q.month], parseInt(q.day, 10),
      parseInt(q.hour, 10) % 24, parseInt(q.minute, 10), parseInt(q.second, 10)
    );
    return Math.round((asUTC - date.getTime()) / 60000);
  }

  function tick() {
    var now = new Date();
    var q = partsFor(now, ZONE);
    var h24 = parseInt(q.hour, 10);
    var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    var mer = h24 < 12 ? "am" : "pm";

    document.getElementById("time").innerHTML =
      h12 + ":" + q.minute + '<span class="mer">' + mer + '</span>';
    document.getElementById("date").textContent =
      q.weekday + ", " + q.month + " " + q.day;

    var weekend = q.weekday === "Sat" || q.weekday === "Sun";
    var open = !weekend && h24 >= 9 && h24 < 18;
    var status = document.getElementById("status");
    status.className = "status" + (open ? "" : " is-closed");
    status.querySelector(".label").textContent =
      open ? "In office" : (weekend ? "Weekend" : "After hours");

    var diff = Math.round(
      (zoneOffsetMinutes(now, ZONE) - zoneOffsetMinutes(now, HOME)) / 60
    );
    status.querySelector(".lag").textContent =
      diff === 0 ? "Your time" : (diff > 0 ? "+" : "") + diff + "h";
  }

  tick();
  setInterval(tick, 10000);
</script>
